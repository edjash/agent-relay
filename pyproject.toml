[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "agent-relay"
dynamic = ["version"]
description = "Start Claude Code or Codex sessions from Gmail, and reply with progress."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Ed Shortt" }]
keywords = ["claude-code", "codex", "ai-agents", "agentic-coding", "gmail", "imap", "automation"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Communications :: Email",
    "Topic :: Software Development",
]
requires-python = ">=3.11"
dependencies = []  # standard library only

[project.urls]
Homepage = "https://github.com/edjash/agent-relay"
Issues = "https://github.com/edjash/agent-relay/issues"

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6", "mypy>=1.11"]

[project.scripts]
agent-relay = "agent_relay.cli:main"

[tool.setuptools.dynamic]
version = { attr = "agent_relay.__version__" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]

[tool.mypy]
strict = true
files = ["src"]
